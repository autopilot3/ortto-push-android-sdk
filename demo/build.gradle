def localConfig = new Properties()
def localConfigFile = file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}

def configValue = { String propertyName, String environmentName ->
    def environmentValue = System.getenv(environmentName)
    return environmentValue != null && !environmentValue.trim().isEmpty()
        ? environmentValue.trim()
        : localConfig.getProperty(propertyName, '').trim()
}

def javaLiteral = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

