name: Release Ortto Android-SDK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: ${{ github.ref }}

    strategy:
      matrix:
        include:
          - environment: PROD
            command: "publishReleasePublicationToSonatypeRepository --max-workers 1 closeAndReleaseSonatypeStagingRepository"

    environment:
      name: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v7

      - name: Extract Version Tag
        run: |
          echo "VERSION_NAME=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Run Tests
        run: ./gradlew test

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bundle
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run:
          ./gradlew ${{ matrix.command }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${VERSION_NAME}" --verify-tag --title "Release ${VERSION_NAME}"
