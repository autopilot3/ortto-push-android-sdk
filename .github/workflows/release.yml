name: Stage Ortto Android SDK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (for example, v1.8.9)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}

    environment:
      name: PROD

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Extract Version Tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${REQUESTED_VERSION}"
          else
            VERSION_NAME="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "${VERSION_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${VERSION_NAME}" >&2
            exit 1
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release locally
        run: ./scripts/release-local.sh verify "${VERSION_NAME}"

      - name: Upload and close staging deployment
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./scripts/release-local.sh stage "${VERSION_NAME}"
