
buildscript {
    repositories {
        maven { url = uri("https://plugins.gradle.org/m2/") }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "io.github.gradle-nexus:publish-plugin:2.0.0"

        // AGP 8.13.2 still requests advisory-affected versions of these build-only
        // packages. Keep the overrides explicit until the parent plugin catches up.
        constraints {
            classpath('io.netty:netty-codec-http2:4.1.137.Final')
            classpath('io.netty:netty-handler-proxy:4.1.137.Final')
            classpath('io.netty:netty-transport-native-unix-common:4.1.137.Final')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.86')
            classpath('org.bouncycastle:bcprov-jdk18on:1.86')
            classpath('org.apache.commons:commons-compress:1.28.0')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
            classpath('org.jdom:jdom2:2.0.6.1')
        }
    }
}

def requestedVersion = System.getenv('VERSION_NAME')
group = 'com.ortto'
version = requestedVersion ? requestedVersion.replaceFirst('^v', '') : '0.0.0-local'
ext.releaseVersion = version.toString()

if (project == rootProject) {
    apply from: "${rootDir}/scripts/publish-root.gradle"
}
