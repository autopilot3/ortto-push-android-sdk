apply plugin: 'maven-publish'
apply plugin: 'signing'

def androidJavadocs = tasks.register('androidJavadocs', Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath = files(android.bootClasspath)
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

android.libraryVariants.configureEach { variant ->
    if (variant.name == 'release') {
        androidJavadocs.configure {
            dependsOn variant.javaCompileProvider
            classpath += variant.javaCompileProvider.get().classpath
            classpath += files(variant.javaCompileProvider.get().destinationDirectory)
        }
    }
}

def androidJavadocsJar = tasks.register('androidJavadocsJar', Jar) {
    dependsOn androidJavadocs
    archiveClassifier.set('javadoc')
    from androidJavadocs.map { it.destinationDir }
}

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // The coordinates of the library, being set from variables that
                // we'll set up later
                groupId = PUBLISH_GROUP_ID
                artifactId = PUBLISH_ARTIFACT_ID
                version = PUBLISH_VERSION

                // Two artifacts, the `aar` (or `jar`) and the sources
                if (project.plugins.findPlugin("com.android.library")) {
                    afterEvaluate {
                        if (components.findByName("release") != null) {
                            from components.release
                        } else {
                            throw new GradleException("Android release component not found. Ensure your `com.android.library` plugin is applied correctly.")
                        }
                    }
                } else {
                    from components.java
                }
                artifact androidJavadocsJar

                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = 'Ortto Android SDK'
                    url = 'https://github.com/autopilot3/ortto-push-android-sdk'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://github.com/autopilot3/ortto-push-android-sdk/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = "ortto"
                            name = "Ortto.com Team"
                            email = "contact@ortto.com"
                        }
                        developer {
                            id = 'mitchflindell'
                            name = 'Mitch Flindell'
                            email = 'mitch@ortto.com'
                        }
                    }

                    scm {
                        url = 'https://github.com/autopilot3/ortto-push-android-sdk'
                        connection = 'scm:git:https://github.com/autopilot3/ortto-push-android-sdk.git'
                        developerConnection = 'scm:git:ssh://git@github.com/autopilot3/ortto-push-android-sdk.git'
                    }
                }
            }
        }
    }
}

def signingKey = rootProject.ext["signing.key"]
if (signingKey != null && !signingKey.isEmpty()) {
    signing {
        useInMemoryPgpKeys(
                rootProject.ext["signing.keyId"],
                signingKey,
                rootProject.ext["signing.password"],
        )
        sign publishing.publications
    }
}
