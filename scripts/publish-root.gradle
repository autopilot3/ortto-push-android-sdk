apply plugin: 'io.github.gradle-nexus.publish-plugin'

ext["ossrhUsername"] = System.getenv('OSSRH_USERNAME')
ext["ossrhPassword"] = System.getenv('OSSRH_PASSWORD')
ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID')
ext["signing.password"] = System.getenv('SIGNING_PASSWORD')
ext["signing.key"] = System.getenv('SIGNING_KEY')

def centralTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase()
    normalizedTaskName.contains('sonatype') ||
            normalizedTaskName.contains('stagingrepositor') ||
            normalizedTaskName == 'closestagingrepositories' ||
            normalizedTaskName == 'releasestagingrepositories'
}

if (centralTaskRequested) {
    def requestedVersion = System.getenv('VERSION_NAME')
    if (requestedVersion == null || !(requestedVersion ==~ /^v\d+\.\d+\.\d+$/)) {
        throw new GradleException('Central staging requires VERSION_NAME in vMAJOR.MINOR.PATCH form')
    }

    def requiredEnvironment = [
            'OSSRH_USERNAME' : ossrhUsername,
            'OSSRH_PASSWORD' : ossrhPassword,
            'SIGNING_KEY'    : rootProject.ext['signing.key'],
            'SIGNING_KEY_ID' : rootProject.ext['signing.keyId'],
            'SIGNING_PASSWORD': rootProject.ext['signing.password'],
    ]
    def missingEnvironment = requiredEnvironment.findAll { name, value ->
        value == null || value.toString().trim().isEmpty()
    }.keySet()
    if (!missingEnvironment.isEmpty()) {
        throw new GradleException("Central staging credentials are incomplete: ${missingEnvironment.join(', ')}")
    }
}

nexusPublishing {
    packageGroup.set('com.ortto')
    repositoryDescription.set("com.ortto:androidsdk:${rootProject.ext.releaseVersion}")
    repositories {
        sonatype {
            username = ossrhUsername
            password = ossrhPassword
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}
